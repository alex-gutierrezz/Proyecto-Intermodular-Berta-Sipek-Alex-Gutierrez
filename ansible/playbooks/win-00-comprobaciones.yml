---
# COMPROBACIONES PREVIAS: no cambia nada en los Windows. Si algo no cuadra, para
# ANTES de tocar ninguna máquina. Al final hace un snapshot "pre-ad" de las 7 VMs
# Windows y una copia de la red de Proxmox, para poder volver atrás.

- name: Comprobar los 7 Windows antes de empezar
  hosts: windows
  gather_facts: false
  any_errors_fatal: true      # si falla uno, no se toca ninguno

  tasks:
    - name: Recordar la IP definitiva y entrar por la actual si tiene ip_actual
      ansible.builtin.set_fact:
        ip_final: "{{ ansible_host }}"
        ansible_host: "{{ ip_actual | default(ansible_host) }}"

    - name: Conexión WinRM
      ansible.windows.win_ping:

    - name: Leer IP, dominio y espacio libre
      ansible.windows.win_powershell:
        script: |
          $cs = Get-CimInstance Win32_ComputerSystem
          [pscustomobject]@{
              ips      = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -ne '127.0.0.1').IPAddress
              dominio  = if ($cs.PartOfDomain) { $cs.Domain } else { '' }
              libre_gb = [math]::Round((Get-PSDrive C).Free / 1GB)
              rol      = $cs.DomainRole     # 4/5 = controlador de dominio
          }
          $Ansible.Changed = $false
      register: estado

    - name: Validar que se puede seguir sin riesgo
      ansible.builtin.assert:
        that:
          - ansible_host in estado.output[0].ips
          - estado.output[0].dominio in ['', ad_dominio]
          - estado.output[0].libre_gb | int >= 10
          - estado.output[0].rol | int < 4 or equipo in ['DC01', 'DC02']
        fail_msg: >-
          {{ equipo }}: algo no cuadra (IP {{ estado.output[0].ips }}, dominio
          '{{ estado.output[0].dominio }}', {{ estado.output[0].libre_gb }} GB libres,
          rol {{ estado.output[0].rol }}). No se ha cambiado nada.
        success_msg: "{{ equipo }} OK"

    - name: Volver a la IP definitiva para los pasos siguientes
      ansible.builtin.set_fact:
        ansible_host: "{{ ip_final }}"

- name: Punto de restauración en Proxmox
  hosts: proxmox
  gather_facts: false
  any_errors_fatal: true
  vars:
    vms_windows: [100, 101, 102, 104, 108, 109, 110]

  tasks:
    - name: Copia de la configuración de red de Proxmox
      ansible.builtin.copy:
        src: /etc/network/interfaces
        dest: /root/interfaces.pre-ad
        remote_src: true
        force: false
        mode: "0644"

    - name: Snapshot pre-ad de cada VM Windows (solo si no existe ya)
      ansible.builtin.shell: |
        set -o pipefail
        if qm listsnapshot {{ item }} | grep -qw pre-ad; then echo EXISTE; else qm snapshot {{ item }} pre-ad --description "Antes del dominio (Ansible)"; fi
      args:
        executable: /bin/bash
      loop: "{{ vms_windows }}"
      register: snap
      changed_when: "'EXISTE' not in snap.stdout"
