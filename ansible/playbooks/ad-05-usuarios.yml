---
# Alta de usuarios, grupos G_/DL_, cuentas especiales y PSO desde usuarios_cibernova.csv
# (Anexo I). Copia scripts/alta-usuarios.ps1 y scripts/datos/ a DC01 y lo ejecuta allí.
# Requiere las OUs de ad-03-estructura.yml.
#
# Simulación (no cambia nada, enseña lo que haría):
#   ansible-playbook playbooks/ad-05-usuarios.yml --ask-vault-pass -e simular=true
# Aplicar:
#   ansible-playbook playbooks/ad-05-usuarios.yml --ask-vault-pass
# Con carpetas personales (cuando FILES01 tenga el recurso, semana 4):
#   ... -e ruta_personales='\\cibernova.local\empresa\Personales'
# Con perfiles móviles (Dirección, Comercial) en el recurso Perfiles$ de ad-06-gpo.yml:
#   ... -e ruta_perfiles='\\files01.cibernova.local\Perfiles$'
# Las dos a la vez, en JSON y entre comillas simples para que bash no toque las barras:
#   ... -e '{"ruta_personales": "\\\\cibernova.local\\empresa\\Personales",
#            "ruta_perfiles": "\\\\files01.cibernova.local\\Perfiles$"}'
#
# Las contraseñas iniciales se quedan en DC01 (C:\CiberNova\credenciales, solo
# Administradores); el playbook nunca las muestra.
- name: Active Directory - usuarios y grupos desde el CSV
  hosts: cn-dc01
  gather_facts: false
  vars:
    destino: 'C:\CiberNova\scripts'
    simular: false

  tasks:
    - name: Carpeta del script en DC01
      ansible.windows.win_file:
        path: "{{ destino }}\\datos"
        state: directory

    - name: Copiar script, CSV y datos
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../scripts/{{ item.src }}"
        dest: "{{ destino }}\\{{ item.dest }}"
      loop:
        - { src: alta-usuarios.ps1,              dest: alta-usuarios.ps1 }
        - { src: datos/usuarios_cibernova.csv,   dest: 'datos\usuarios_cibernova.csv' }
        - { src: datos/config-alta.psd1,         dest: 'datos\config-alta.psd1' }
        - { src: datos/grupos-dl.csv,            dest: 'datos\grupos-dl.csv' }
      loop_control:
        label: "{{ item.src }}"

    - name: Ejecutar el alta{{ ' (SIMULACIÓN)' if simular | bool else '' }}
      ansible.windows.win_powershell:
        parameters:
          Script: "{{ destino }}\\alta-usuarios.ps1"
          Simular: "{{ simular | bool }}"
          RutaPersonales: "{{ ruta_personales | default('') }}"
          RutaPerfiles: "{{ ruta_perfiles | default('') }}"
        script: |
          param([string]$Script, [bool]$Simular, [string]$RutaPersonales, [string]$RutaPerfiles)
          $argumentos = @{ WhatIf = $Simular }
          if ($RutaPersonales) { $argumentos.RutaPersonales = $RutaPersonales }
          if ($RutaPerfiles)   { $argumentos.RutaPerfiles   = $RutaPerfiles }
          $r = & $Script @argumentos
          $Ansible.Changed = (-not $r.Simulacion) -and ($r.Cambios -gt 0)
          $r
      # El doble salto (DC01 -> FILES01) solo hace falta para las carpetas personales
      become: "{{ ruta_personales is defined or ruta_perfiles is defined }}"
      register: alta

    - name: Resumen
      ansible.builtin.debug:
        msg:
          - "Simulación: {{ alta.output[0].Simulacion }}"
          - "Cambios: {{ alta.output[0].Cambios }} · cuentas creadas: {{ alta.output[0].Creados }}"
          - "Avisos: {{ alta.output[0].Avisos }}"
          - "Errores: {{ alta.output[0].Errores }}"
          - "Log en DC01: {{ alta.output[0].Log }}"
          - "Contraseñas iniciales en DC01: {{ alta.output[0].Credenciales | default('ninguna nueva', true) }}"
      when: alta.output | length > 0

    - name: Parar si el script ha tenido errores (detalle en el log de DC01)
      ansible.builtin.fail:
        msg: "{{ alta.output[0].Errores | length }} errores en el alta"
      when: alta.output | length > 0 and alta.output[0].Errores | length > 0
