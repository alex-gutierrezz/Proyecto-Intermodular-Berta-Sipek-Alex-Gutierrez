---
# Ámbitos DHCP de CiberNova.
# Red de clientes: VLAN 50, 192.168.50.0/24 (PROPUESTA, se decide el 17/11).
#   .1 puerta de enlace (Proxmox) · .2–.19 IPs fijas · .20–.250 ámbito DHCP
# Los clientes llegan al DHCP por el relay de Proxmox (en la empresa, el switch de
# capa 3 con "ip helper-address"). Si se aprueban más VLAN de clientes, se añaden aquí.

dhcp_failover_nombre: CN-DHCP01-DHCP02
dhcp_secundario_fqdn: "dhcp02.{{ ad_dominio }}"

dhcp_ambitos:
  - nombre: "VLAN50-Clientes"
    red: 192.168.50.0
    inicio: 192.168.50.20
    fin: 192.168.50.250
    concesion: "8.00:00:00"
