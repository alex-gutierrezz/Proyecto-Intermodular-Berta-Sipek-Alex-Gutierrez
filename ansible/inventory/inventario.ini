[control]
localhost ansible_connection=local

[web]
cn-web01 ansible_host=192.168.100.30
cn-web02 ansible_host=192.168.100.31

[db]
cn-db01 ansible_host=192.168.40.40
cn-db02 ansible_host=192.168.40.41

[mon]
cn-cmk ansible_host=192.168.40.20

[linux:children]
web
db
mon

[linux:vars]
ansible_user=alex

[proxmox]
proxmoxab ansible_host=192.168.40.4 ansible_user=root

# ---------------------------------------------------------------
# Servidores Windows Server 2025 (VLAN 40). Gestionados por WinRM.
# ansible_host = IP DEFINITIVA (plan de bloques por función, 13/11).
# equipo       = nombre del servidor dentro de Windows.
# ip_actual    = SOLO si el servidor tiene todavía otra IP: win-01-base.yml entra por
#                ella, le pone la definitiva y sigue. Después, borrad ip_actual.
# ---------------------------------------------------------------
[dc]
cn-dc01 ansible_host=192.168.40.10 equipo=DC01
cn-dc02 ansible_host=192.168.40.11 equipo=DC02

[dhcp]
cn-dhcp01 ansible_host=192.168.40.12 equipo=DHCP01
cn-dhcp02 ansible_host=192.168.40.13 equipo=DHCP02

[files]
cn-files01 ansible_host=192.168.40.30 equipo=FILES01
cn-files02 ansible_host=192.168.40.31 equipo=FILES02

[backup]
cn-backup ansible_host=192.168.40.50 equipo=BACKUP

# Ejemplo: si FILES01 se configuró con la IP provisional .14
# cn-files01 ansible_host=192.168.40.30 equipo=FILES01 ip_actual=192.168.40.14

# Servidores que se unen al dominio como miembros (no son DC)
[miembros:children]
dhcp
files
backup

[windows:children]
dc
miembros
