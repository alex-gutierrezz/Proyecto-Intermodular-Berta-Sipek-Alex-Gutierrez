# /etc/network/interfaces de proxmoxAB — FRAGMENTO (vmbr1 y VLANs)
#
# Es el fragmento de la sección 6.3 de la memoria.
# PENDIENTE: sustituirlo por la copia completa del fichero, incluidos lo y vmbr0
# (en proxmoxAB: cat /etc/network/interfaces).
# vmbr0 (192.168.202.7/22, gw 192.168.200.254, puerto nic1) no se tocó al montar las VLANs.

auto vmbr1
iface vmbr1 inet manual
    bridge-ports none
    bridge-stp off
    bridge-fd 0
    bridge-vlan-aware yes
    bridge-vids 2-4094

auto vmbr1.40
iface vmbr1.40 inet static
    address 192.168.40.1/24
    post-up echo 1 > /proc/sys/net/ipv4/ip_forward
    post-up iptables -t nat -A POSTROUTING -s 192.168.40.0/24 -o vmbr0 -j MASQUERADE
    post-down iptables -t nat -D POSTROUTING -s 192.168.40.0/24 -o vmbr0 -j MASQUERADE

auto vmbr1.100
iface vmbr1.100 inet static
    address 192.168.100.1/24
    post-up iptables -t nat -A POSTROUTING -s 192.168.100.0/24 -o vmbr0 -j MASQUERADE
    post-down iptables -t nat -D POSTROUTING -s 192.168.100.0/24 -o vmbr0 -j MASQUERADE

source /etc/network/interfaces.d/*
